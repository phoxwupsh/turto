[package]
name = "turto"
version = "3.0.1"
edition = "2024"
authors = ["phoxwupsh"]
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/phoxwupsh/turto"
description = "turto is a simple, easy-to-use and customizable Discord music bot, especially suitable for self-hosting."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["turto-macros"]

[dependencies]
turto-macros = { path = "turto-macros" }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.154"
regex = "1.13.1"
toml = "0.8.19"
rand = "0.8.5"
sha256 = "1.6.0"
which = "6.0.3"
tracing-appender = "0.2.5"
chrono = "0.4.45"
tempfile = "3.27.0"
zip = "5.1.1"
flate2 = "1.1.11"
tar = "0.4.46"
clap = { version = "4.6.8", features = ["derive"] }
tokio-cron-scheduler = "0.15.1"
arc-swap = "1.9.5"
uuid = "1.26.1"
thiserror = "2.0.21"
strum = { version = "0.27.2", features = ["derive"] }
paste = "1.0.15"
serde_ignored = "0.1.14"
time = "0.3.55"
lazy-regex = "3.6.2"
async-trait = "0.1.92"
futures = "0.3.34"
base64 = "0.23.1"
bytes = "1.12.1"
hls_m3u8 = "0.7"
inventory = "0.3.25"

[dependencies.serenity]
version = "0.12.5"
features = [
    "client",
    "standard_framework",
    "cache",
    "voice",
    "rustls_backend",
    "collector",
]

[dependencies.tokio]
version = "1.54.1"
features = ["macros", "rt-multi-thread", "signal"]

[dependencies.songbird]
version = "0.6.1"

[dependencies.dashmap]
version = "6.2.1"
features = ["serde"]

[dependencies.symphonia]
version = "0.5.5"
features = ["all"]

[dependencies.reqwest]
version = "0.12.28"
default-features = false
features = ["charset", "http2", "rustls-tls", "json"]

[dependencies.poise]
version = "0.6.2"
features = ["chrono"]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
